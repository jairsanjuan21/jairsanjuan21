  <title id="t">Notificaciones ANM (en producción)</title>
  <desc id="d">Vigila el portal de la Agencia Nacional de Minería y avisa antes de que venza un plazo. Entrada: Portal de la ANM avisos, edictos y cobro coactivo. Proceso: Barridos programados lectura del PDF y plazos hábiles. Salida: Correo, bots de Telegram y panel de vencimientos.</desc>
