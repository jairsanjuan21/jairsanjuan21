  <text x="74" y="186" class="sans" font-size="16" fill="#EEF0F6">Empresas asesoradas</text>
  <text x="74" y="207" class="sans" font-size="16" fill="#EEF0F6">y sus formatos del SG-SST</text>
  <path d="M394,179 L426,179" stroke="#3FB68B" stroke-width="2"/><path d="M419,173 L427,179 L419,185" fill="none" stroke="#3FB68B" stroke-width="2"/>
  <rect x="435" y="138" width="330" height="82" rx="10" fill="#1B2445" stroke="#2E3A66" stroke-dasharray="6 5"/>
  <text x="453" y="162" class="mono" font-size="13" fill="#3FB68B">Proceso</text>
