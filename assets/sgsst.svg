  <text x="1094.3" y="59" text-anchor="middle" class="sans" font-size="15" fill="#3FB68B">En diseño</text>
  <text x="56" y="102" class="sans" font-size="18" fill="#8A93B2">Reúne en una sola vista la documentación de seguridad y salud de varias empresas.</text>
  <rect x="56" y="138" width="330" height="82" rx="10" fill="#1B2445" stroke="#2E3A66" stroke-dasharray="6 5"/>
