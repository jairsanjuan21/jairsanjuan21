<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" width="1200" height="250" role="img" aria-labelledby="t d">
  <title id="t">Sistema web SG-SST (en diseño)</title>
  <desc id="d">Reúne en una sola vista la documentación de seguridad y salud de varias empresas. Entrada: Empresas asesoradas y sus formatos del SG-SST. Proceso: Ciclo PHVA y gestión documental con plantillas. Salida: Vista central con roles de edición y de consulta.</desc>
