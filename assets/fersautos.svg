<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" width="1200" height="250" role="img" aria-labelledby="t d">
  <title id="t">Catálogo Fersautos Suzuki (en desarrollo)</title>
  <desc id="d">Lleva al cliente desde una publicación en redes hasta una solicitud de crédito lista. Entrada: Cliente que llega desde redes sociales o el catálogo. Proceso: Formulario de crédito con firma y fotos de la cédula. Salida: PDF diligenciado y panel de la asesora con sus clientes.</desc>
